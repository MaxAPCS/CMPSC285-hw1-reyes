[package]
name = "reyes"
version = "0.1.0"
edition = "2024"
description = "ECE/CS 285 HW1: a REYES renderer in Rust, driven by the C++ scene files"
build = "build.rs"

[dependencies]
ndarray = { version = "0.17", features = ["rayon"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga"] }
nalgebra = { version = "0.35", default-features = false, features = ["std", "rand"] }

[build-dependencies]
# build.rs compiles the C++ scene files with it.
cc = "1"

[profile.dev]
opt-level = 1
overflow-checks = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[features]
splat = []