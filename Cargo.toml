[package]
name = "reyes"
version = "0.1.0"
edition = "2024"
description = "ECE/CS 285 HW1: a REYES renderer in Rust, driven by the C++ scene files"
build = "build.rs"

[[bin]]
name = "reyes"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "1.25", features = ["must_cast", "derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga"] }
nalgebra = "0.35"

[build-dependencies]
# build.rs compiles the C++ scene files with it.
cc = "1"

[profile.dev]
opt-level = 1
overflow-checks = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
debug = 0
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
